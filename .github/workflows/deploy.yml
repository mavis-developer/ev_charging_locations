# Builds the UK charger data from OpenStreetMap and publishes the site to GitHub Pages.
# Runs weekly (fresh data), on every push to main (code changes), and on demand from the Actions tab.
name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyosmium
        run: pip install osmium==4.3.2

      # The UK extract is ~2.3 GB. Cache it per ISO week so repeated pushes don't re-download it
      # (Geofabrik asks users not to download the same file over and over).
      - name: Work out cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: uk.osm.pbf
          key: osm-uk-${{ steps.week.outputs.week }}

      - name: Download UK OpenStreetMap extract
        run: test -f uk.osm.pbf || curl -fsSL -o uk.osm.pbf https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf

      # The Open Charge Map key is the repo secret OPEN_CHARGE_MAP_NOV_2026
      # (Settings → Secrets and variables → Actions). If you replace the key under a new name, update it here.
      # Without it the build still works, using OpenStreetMap chargers only.
      - name: Build charger tiles
        env:
          OCM_API_KEY: ${{ secrets.OPEN_CHARGE_MAP_NOV_2026 }}
        run: python scripts/build_data.py uk.osm.pbf site/data --source "OpenStreetMap UK (Geofabrik)"

      # Version the script/style links with the commit, so browsers fetch new code straight after
      # a deploy instead of reusing their cached copy (GitHub Pages lets browsers cache for 10 min).
      - name: Assemble site
        run: |
          cp index.html app.js style.css categories.json site/
          v="${GITHUB_SHA::7}"
          sed -i -e "s|src=\"app.js\"|src=\"app.js?v=$v\"|" -e "s|href=\"style.css\"|href=\"style.css?v=$v\"|" site/index.html
          grep -q "app.js?v=$v" site/index.html && grep -q "style.css?v=$v" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
